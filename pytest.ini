[pytest]
# Configuration pytest pour OGMA

# Répertoire racine des tests
testpaths = tests

# Pattern de découverte des tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Options par défaut
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes

# Configuration pytest-asyncio
asyncio_mode = auto

# Markers personnalisés
markers =
    asyncio: Tests asynchrones (async/await)
    slow: Tests lents (>1s)
    integration: Tests d'intégration
    e2e: Tests end-to-end
    requires_api: Nécessite API keys valides
    requires_gpu: Nécessite GPU NVIDIA

# Couverture de code
[coverage:run]
source = .
omit =
    tests/*
    venv/*
    */site-packages/*
    backups/*
    debug_*.py
    test_*.py
    *_backup.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
